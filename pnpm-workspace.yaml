packages:
  - '.'
  - 'tests'
  - 'example'

allowBuilds:
  puppeteer: true

minimumReleaseAgeExclude:
  - '@rsbuild/*'
  - '@rslib/*'
  - '@rslint/*'
  - '@rspack/*'
  - '@rspress/*'
  - '@rstackjs/*'
  - '@rstest/*'
  - '@typescript/*'
  - 'rsbuild-plugin-*'
  - rstack
  - typescript
  - '@rspack-canary/*'

permissions:
  rstack:
    skills:
      - rstack-cli-docs
