name: Test

env:
  PUPPETEER_SKIP_DOWNLOAD: true

# Controls when the action will run.
on:
  # Triggers the workflow on pull request events but only for the main branch
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  test:
    permissions:
      contents: read

    name: Test - ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            puppeteer-executable-path: /usr/bin/google-chrome
          - os: windows-latest
            puppeteer-executable-path: 'C:\Program Files\Google\Chrome\Application\chrome.exe'

    runs-on: ${{ matrix.os }}

    env:
      PUPPETEER_EXECUTABLE_PATH: ${{ matrix.puppeteer-executable-path }}

    concurrency:
      group: test-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: true

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Install Pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: true

      - name: Run Test
        run: pnpm run test

  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - name: Install Pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: true

      - name: Check
        run: pnpm run check
